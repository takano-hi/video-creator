services:
  api:
    build:
      context: ./mcp
      dockerfile: Dockerfile.dev
    ports:
      - "3000:80"
    env_file:
      - env/api.env
    environment:
      RAILS_ENV: development
      VOICEVOX_BASE_URL: http://voicevox:50021
    volumes:
      - ./mcp:/rails
      - ./mcp/config/master.key:/rails/config/master.key:ro
    depends_on:
      voicevox:
        condition: service_healthy

  voicevox:
    image: voicevox/voicevox_engine:cpu-ubuntu20.04-latest
    platform: linux/amd64
    ports:
      - "50021:50021"
    healthcheck:
      test: ["CMD", "echo", "http://localhost:50021/version"]
      interval: 3s
      timeout: 5s
      retries: 5
      start_period: 30s
